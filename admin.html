const SUPABASE_URL="https://dthvdxgxesomltlruogp.supabase.co",SUPABASE_KEY="sb_publishable_rpHsazbgtLck-E8784JHYA_q5WMGinr",supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let currentUser=null,isAdmin=false,allUsers=[],mods=[],allReports=[],reportProfiles={},reportTasks={},safetyFlags=[];window.reportFilter="all";
function esc(value){return String(value??"").replace(/[&<>"']/g,character=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[character]))}function money(value){return "₦"+Number(value||0).toLocaleString("en-NG",{minimumFractionDigits:2,maximumFractionDigits:2})}function timeout(promise,ms=10000){return Promise.race([promise,new Promise((_,reject)=>setTimeout(()=>reject(new Error("The request timed out. Please check your internet connection and try again.")),ms))])}
async function init(){try{if(!window.supabase)throw new Error("Supabase library failed to load. Refresh the page and try again.");const {data,error}=await timeout(supabaseClient.auth.getSession());if(error)throw error;if(!data?.session){location.href="login.html";return}currentUser=data.session.user;const adminCheck=await timeout(supabaseClient.from("admin_users").select("user_id").eq("user_id",currentUser.id).maybeSingle());if(adminCheck.error)throw adminCheck.error;if(!adminCheck.data){document.getElementById("app").innerHTML='<div class="error"><b>Access denied.</b><br>This account is not a StudTask administrator.</div>';return}isAdmin=true;await loadAll()}catch(error){document.getElementById("app").innerHTML=`<div class="error"><b>Could not verify administrator access.</b><br>${esc("Something went wrong. Please try again."||"Unknown error")}<br><br><button class="btn refresh" type="button" onclick="location.reload()">TRY AGAIN</button></div>`}}
async function loadAll(){if(!isAdmin)return;const button=document.getElementById("refreshBtn");button.disabled=true;renderBase();try{const [verifications,tasks,withdrawals,users,reports,stats,disputes,support,deletions,safety]=await Promise.all([getVerifications(),getTasks(),getWithdrawals(),getUsers(),getReports(),getStats(),getDisputes(),getSupportTickets(),getDeletionRequests(),getSafetyFlags()]);if(verifications.error||tasks.error||withdrawals.error||users.error||reports.error||stats.error||disputes.error||support.error||deletions.error||safety.error)throw verifications.error||tasks.error||withdrawals.error||users.error||reports.error||stats.error||disputes.error||support.error||deletions.error;document.getElementById("statsBox").innerHTML=renderStats(stats);updateBadges(verifications.data,tasks.data,withdrawals.data,reports.data,disputes.data,support.data);document.getElementById("verificationBox").innerHTML=renderVerifications(verifications.data,verifications.profiles);document.getElementById("taskBox").innerHTML=renderTasks(tasks.data,tasks.profiles);document.getElementById("withdrawalBox").innerHTML=renderWithdrawals(withdrawals.data,withdrawals.profiles);allUsers=users.users||[];mods=users.mods||[];document.getElementById("userBox").innerHTML=renderUsers();allReports=reports.data||[];reportProfiles={};reportTasks={};(reports.profiles||[]).forEach(profile=>reportProfiles[profile.id]=profile);(reports.tasks||[]).forEach(task=>reportTasks[task.id]=task);document.getElementById("reportBox").innerHTML=renderReports();document.getElementById("disputeBox").innerHTML=renderDisputes(disputes.data||[],disputes.profiles||{},disputes.tasks||{});document.getElementById("supportBox").innerHTML=renderSupportTickets(support.data||[],support.profiles||{},support.messages||{});document.getElementById("deletionBox").innerHTML=renderDeletionRequests(deletions.data||[],deletions.profiles||{});safetyFlags=safety.data||[];document.getElementById("safetyBox").innerHTML=renderSafetyFlags(safetyFlags);document.getElementById("badge-safety").textContent=safetyFlags.length;const quickSafety=document.getElementById("quick-safety");if(quickSafety){quickSafety.textContent=safetyFlags.length;quickSafety.classList.toggle("zero",safetyFlags.length===0)}await loadMonitoring()}catch(error){document.getElementById("app").innerHTML=`<div class="error"><b>Could not load the admin dashboard.</b><br>${esc("Something went wrong. Please try again."||"Unknown error")}</div>`}finally{button.disabled=false}}
async function getStats(){const [users,verifications,tasks,applications,payments,deposits,withdrawals,reports,support,waitlist]=await Promise.all([supabaseClient.from("profiles").select("id",{count:"exact",head:true}),supabaseClient.from("profile_verifications").select("user_id,status"),supabaseClient.from("tasks").select("id,moderation_status,status"),supabaseClient.from("task_applications").select("id"),supabaseClient.from("task_payments").select("amount,status"),supabaseClient.from("deposit_requests").select("amount,status"),supabaseClient.from("withdrawal_requests").select("amount,status"),supabaseClient.from("reports").select("id,status"),supabaseClient.from("support_tickets").select("id,status"),supabaseClient.from("waitlist_signups").select("id",{count:"exact",head:true})]);const results=[users,verifications,tasks,applications,payments,deposits,withdrawals,reports,support,waitlist];const failed=results.find(x=>x.error);if(failed)return{error:failed.error};const verified=new Set((verifications.data||[]).filter(v=>v.status==="verified").map(v=>v.user_id));const list=tasks.data||[],paymentRows=payments.data||[],depositRows=deposits.data||[],withdrawalRows=withdrawals.data||[],reportRows=reports.data||[],supportRows=support.data||[];return{users:users.count||0,verified:verified.size,unverified:Math.max(0,(users.count||0)-verified.size),tasks:list.length,approved:list.filter(t=>t.moderation_status==="approved").length,rejected:list.filter(t=>t.moderation_status==="rejected").length,pending:list.filter(t=>!t.moderation_status||t.moderation_status==="pending").length,completedTasks:list.filter(t=>t.status==="completed").length,activeTasks:list.filter(t=>["open","accepted","in_progress","awaiting_verification"].includes(t.status)).length,applications:(applications.data||[]).length,openReports:reportRows.filter(r=>!["resolved","dismissed"].includes(String(r.status||"").toLowerCase())).length,supportOpen:supportRows.filter(x=>x.status==="open"||x.status==="pending").length,waitlist:waitlist.count||0,completedTaskValue:paymentRows.filter(p=>p.status==="released"||p.status==="completed").reduce((sum,p)=>sum+Number(p.amount||0),0),depositValue:depositRows.filter(d=>d.status==="completed").reduce((sum,d)=>sum+Number(d.amount||0),0),withdrawalValue:withdrawalRows.filter(w=>w.status==="completed").reduce((sum,w)=>sum+Number(w.amount||0),0)}}
async function getDisputes(){
      const { data, error } = await supabaseClient
        .from('task_disputes')
        .select('id,task_id,opened_by,reason,description,status,resolution,resolved_by,admin_note,created_at,resolved_at')
        .order('created_at', { ascending: false });
      if(error) return { error };
      const disputes = data || [];
      const ids = new Set();
      disputes.forEach(dispute => {
        if(dispute.opened_by) ids.add(dispute.opened_by);
        if(dispute.resolved_by) ids.add(dispute.resolved_by);
      });
      const taskIds = [...new Set(disputes.map(dispute => dispute.task_id).filter(Boolean))];
      const [profilesResult, tasksResult] = await Promise.all([
        ids.size ? supabaseClient.from('profiles').select('id,username,full_name').in('id', [...ids]) : Promise.resolve({ data: [], error: null }),
        taskIds.length ? supabaseClient.from('tasks').select('id,title,user_id,runner_id,budget,status').in('id', taskIds) : Promise.resolve({ data: [], error: null })
      ]);
      if(profilesResult.error) return { error: profilesResult.error };
      if(tasksResult.error) return { error: tasksResult.error };
      const profiles = {};
      (profilesResult.data || []).forEach(profile => profiles[profile.id] = profile);
      const tasks = {};
      (tasksResult.data || []).forEach(task => tasks[task.id] = task);
      return { data: disputes, profiles, tasks };
    }

    function profileLabel(profiles, id){
      const profile = profiles[id];
      if(!profile) return id ? String(id).slice(0, 8) + '...' : 'Unknown user';
      return profile.full_name || profile.username || String(id).slice(0, 8) + '...';
    }

    async function getWithdrawals(){const{data,error}=await supabaseClient.from("withdrawal_requests").select("id,user_id,amount,fee_amount,net_amount,status,destination,provider_reference,admin_note,proof_path,created_at,processed_at").order("created_at",{ascending:false});if(error)return{error};if(!data?.length)return{data:[],profiles:[]};const ids=[...new Set(data.map(x=>x.user_id).filter(Boolean))],result=await supabaseClient.from("profiles").select("id,username,full_name").in("id",ids);return{data,profiles:result.data||[],error:result.error}}
function renderWithdrawals(data,profiles){if(!data?.length)return'<div class="empty">No withdrawal requests yet.</div>';const map={};(profiles||[]).forEach(p=>map[p.id]=p);return data.map(x=>{const p=map[x.user_id]||{},name=p.full_name||p.username||"StudTask User";return'<div class="card"><div class="title">'+esc(name)+'</div><div class="muted">@'+esc(p.username||"unknown")+'</div><div class="status '+(x.status==="completed"?"active":x.status==="rejected"?"rejected":"")+'">'+esc(x.status)+'</div><div class="info"><b>Requested:</b> '+money(x.amount)+'<br><b>5% fee:</b> '+money(x.fee_amount)+'<br><b>Payout:</b> '+money(x.net_amount)+'<br><b>Destination:</b> '+esc(x.destination||"Not provided")+'<br><b>Created:</b> '+esc(new Date(x.created_at).toLocaleString())+(x.provider_reference?'<br><b>Provider reference:</b> '+esc(x.provider_reference):"")+(x.admin_note?'<br><b>Admin note:</b> '+esc(x.admin_note):"")+'</div>'+(x.status==="pending"?'<div class="actions"><button class="btn approve" type="button" onclick="payWithdrawalWithPalmPay(\''+x.id+'\')">📲 PAY WITH PALMPAY</button><button class="btn view" type="button" onclick="completeWithdrawal(\''+x.id+'\',\''+x.user_id+'\')">✓ MARK AS PAID</button><button class="btn reject" type="button" onclick="rejectWithdrawal(\''+x.id+'\')">✕ REJECT & REFUND</button></div><div class="muted" style="margin-top:8px">Pay manually from PalmPay, then use Mark as Paid only after the transfer is completed.</div>':x.status==="processing"?'<div class="actions"><button class="btn view" type="button" onclick="completeWithdrawal(\''+x.id+'\',\''+x.user_id+'\')">✓ MARK AS PAID</button><button class="btn reject" type="button" onclick="rejectWithdrawal(\''+x.id+'\')">✕ REJECT & REFUND</button></div>':x.status==="completed"?(x.proof_path?'<div class="status active">✓ PAYMENT PROOF ATTACHED</div>':'<div style="margin-top:10px"><input type="file" id="proof-'+x.id+'" accept="image/jpeg,image/png,image/webp" style="width:100%;font-size:11px"><div class="a function renderDisputes(disputes, profiles, tasks){
      if(!disputes.length) return '<div class="empty">No disputes have been opened.</div>';
      return disputes.map(dispute => {
        const task = tasks[dispute.task_id] || {};
        const isOpen = dispute.status === 'open' || dispute.status === 'under_review';
        const openedBy = profileLabel(profiles, dispute.opened_by);
        const taskOwner = profileLabel(profiles, task.user_id);
        const runner = profileLabel(profiles, task.runner_id);
        const created = dispute.created_at ? new Date(dispute.created_at).toLocaleString() : 'Unknown';
        const resolved = dispute.resolved_at ? new Date(dispute.resolved_at).toLocaleString() : '';
        const statusClass = isOpen ? 'warned' : 'resolved';
        const controls = isOpen ? `
          <textarea class="note" id="disputeNote-${dispute.id}" placeholder="Optional admin note or reason"></textarea>
          <div class="actions">
            <button class="btn approve" type="button" onclick="resolveDispute('${dispute.id}','runner')">✓ Resolve for Runner</button>
            <button class="btn reject" type="button" onclick="resolveDispute('${dispute.id}','poster')">↩ Resolve for Poster</button>
            <button class="btn dismiss" type="button" onclick="resolveDispute('${dispute.id}','dismissed')">Dismiss</button>
          </div>` : `
          <div class="info"><b>Resolution:</b> ${esc(dispute.resolution || '—')}<br><b>Resolved:</b> ${esc(resolved || '—')}${dispute.admin_note ? `<br><b>Admin note:</b> ${esc(dispute.admin_note)}` : ''}</div>`;
        return `<div class="card">
          <div class="title">${esc(task.title || 'Task dispute')}</div>
          <div class="muted">Opened ${esc(created)}</div>
          <span class="status ${statusClass}">${esc(dispute.status || 'unknown')}</span>
          <div class="info"><b>Reason:</b> ${esc(dispute.reason || '—')}<br><b>Opened by:</b> ${esc(openedBy)}<br><b>Poster:</b> ${esc(taskOwner)}<br><b>Runner:</b> ${esc(runner)}<br><b>Budget:</b> ₦${esc(Number(task.budget || 0).toLocaleString())}</div>
          <div class="desc">${esc(dispute.description || 'No description provided.')}</div>
          ${controls}
        </div>`;
      }).join('');
    }

    async function resolveDispute(disputeId, resolution){
      const labels = { runner: 'resolve this dispute for the runner', poster: 'resolve this dispute for the poster', dismissed: 'dismiss this dispute' };
      if(!confirm(`Are you sure you want to ${labels[resolution] || 'resolve this dispute'}? This may move or refund task funds.`)) return;
      const noteElement = document.getElementById(`disputeNote-${disputeId}`);
      const adminNote = noteElement ? noteElement.value.trim() || null : null;
      try{
        const { error } = await supabaseClient.rpc('admin_resolve_task_dispute', {
          p_dispute_id: disputeId,
          p_resolution: resolution,
          p_admin_note: adminNote
        });
        if(error) throw error;
        alert('Dispute resolved successfully.');
        await loadAll();
      }catch(error){
        alert(`Could not resolve dispute: ${"Something went wrong. Please try again." || 'Unknown error'}`);
      }
    }

async function moderateUser(userId,action,durationDays=null){if(!isAdmin||!currentUser||userId===currentUser.id){alert("You cannot moderate your own account.");return}const reason=document.getElementById("reason_"+userId)?.value.trim()||"";if(action!=="unban"&&!reason){alert("Please enter a reason.");return}const label=action==="warning"?"issue a warning":action==="temporary_ban"?"temporarily restrict this user for "+Number(durationDays||7)+" days":action==="permanent_ban"?"permanently restrict this user":"remove the restriction";if(!confirm("Are you sure you want to "+label+"?"))return;try{const{error}=await supabaseClient.rpc("admin_set_user_moderation",{p_user_id:userId,p_action:action,p_reason:reason||null,p_duration_days:durationDays});if(error)throw error;alert(action==="warning"?"Warning issued.":action==="temporary_ban"?"Temporary restriction applied.":action==="permanent_ban"?"Permanent restriction applied.":"User unbanned.");await loadAll()}catch(error){alert("Moderation failed: "+("Something went wrong. Please try again."||"Unknown error"))}}let waitlistRows=[];function closeWaitlist(){const overlay=document.getElementById("waitlistOverlay");if(overlay){overlay.style.display="none";overlay.setAttribute("aria-hidden","true")}}function renderWaitlist(){const query=(document.getElementById("waitlistSearch")?.value||"").trim().toLowerCase(),statusFilter=document.getElementById("waitlistStatusFilter")?.value||"all",campusFilter=document.getElementById("waitlistCampusFilter")?.value||"all";const filtered=waitlistRows.filter(x=>(statusFilter==="all"||x.contact_status===statusFilter)&&(campusFilter==="all"||String(x.campus||"")===campusFilter)&&[x.full_name,x.email,x.phone,x.campus,x.admin_note].some(v=>String(v||"").toLowerCase().includes(query)));const counts={new:waitlistRows.filter(x=>x.contact_status==="new").length,contacted:waitlistRows.filter(x=>x.contact_status==="contacted").length,invited:waitlistRows.filter(x=>x.contact_status==="invited").length};const latest=waitlistRows[0]?.created_at?new Date(waitlistRows[0].created_at).toLocaleString():"—";const campuses=[...new Set(waitlistRows.map(x=>String(x.campus||"")).filter(Boolean))].sort();const content=document.getElementById("waitlistContent");if(!content)return;content.innerHTML=`<div class="waitlist-stats"><div class="waitlist-stat"><div class="waitlist-label">TOTAL SIGNUPS</div><div class="waitlist-num">${waitlistRows.length}</div></div><div class="waitlist-stat"><div class="waitlist-label">NEW / CONTACTED / INVITED</div><div style="font-size:14px;font-weight:900;margin-top:8px">${counts.new} / ${counts.contacted} / ${counts.invited}</div></div></div><div class="waitlist-tools"><input id="waitlistSearch" class="search" value="${esc(query)}" placeholder="Search name, email, phone or campus"><select id="waitlistStatusFilter" class="search" style="margin:0;resize:none"><option value="all" ${statusFilter==="all"?"selected":""}>All statuses</option><option value="new" ${statusFilter==="new"?"selected":""}>New</option><option value="contacted" ${statusFilter==="contacted"?"selected":""}>Contacted</option><option value="invited" ${statusFilter==="invited"?"selected":""}>Invited</option></select><select id="waitlistCampusFilter" class="search" style="margin:0;resize:none"><option value="all">All campuses</option>${campuses.map(v=>`<option value="${esc(v)}" ${campusFilter===v?"selected":""}>${esc(v)}</option>`).join("")}</select><button class="btn refresh" type="button" onclick="loadWaitlist()">↻ REFRESH</button><button class="btn view" type="button" onclick="exportWaitlist()">⇩ CSV</button></div><div class="waitlist-table"><table><thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Campus</th><th>Status</th><th>Admin note</th><th>Actions</th></tr></thead><tbody>${filtered.map(x=>`<tr><td>${esc(x.full_name)}</td><td>${esc(x.email)}</td><td>${esc(x.phone)}</td><td>${esc(x.campus||"—")}</td><td><select id="wl-status-${x.id}" style="padding:7px;border:1px solid #d7dee8;border-radius:8px"><option value="new" ${x.contact_status==="new"?"selected":""}>New</option><option value="contacted" ${x.contact_status==="contacted"?"selected":""}>Contacted</option><option value="invited" ${x.contact_status==="invited"?"selected":""}>Invited</option></select></td><td><input id="wl-note-${x.id}" value="${esc(x.admin_note||"")}" placeholder="Note" style="width:150px;padding:7px;border:1px solid #d7dee8;border-radius:8px"></td><td><button class="btn approve" type="button" onclick="saveWaitlistRow('${x.id}')">SAVE</button></td></tr>`).join("")||'<tr><td colspan="7" style="padding:25px;text-align:center;color:#667085">No matching signups.</td></tr>'}</tbody></table></div>`;document.getElementById("waitlistSearch").addEventListener("input",renderWaitlist);document.getElementById("waitlistStatusFilter").addEventListener("change",renderWaitlist);document.getElementById("waitlistCampusFilter").addEventListener("change",renderWaitlist)}
async function saveWaitlistRow(id){if(!isAdmin||!currentUser)return;const status=document.getElementById("wl-status-"+id)?.value,note=document.getElementById("wl-note-"+id)?.value.trim()||null,update={contact_status:status,admin_note:note,contacted_at:status==="new"?null:(waitlistRows.find(x=>x.id===id)?.contacted_at||new Date().toISOString()),contacted_by:status==="new"?null:currentUser.id};const {error}=await supabaseClient.from("waitlist_signups").update(update).eq("id",id);if(error){alert("Could not update waitlist entry: "+"Something went wrong. Please try again.");return}const row=waitlistRows.find(x=>x.id===id);if(row)Object.assign(row,update);renderWaitlist();alert("Waitlist entry updated.")}async function loadWaitlist(){if(!isAdmin||!currentUser){alert("Administrator access required.");return}const status=document.getElementById("waitlistStatus");status.textContent="Loading waitlist...";status.style.display="block";const {data,error}=await timeout(supabaseClient.from("waitlist_signups").select("id,full_name,email,phone,campus,created_at,contact_status,admin_note,contacted_at").order("created_at",{ascending:false}));if(error){status.textContent="Could not load waitlist: "+"Something went wrong. Please try again.";return}waitlistRows=data||[];status.style.display="none";renderWaitlist()}function openWaitlist(){if(!isAdmin||!currentUser){alert("Administrator access required.");return}const overlay=document.getElementById("waitlistOverlay");overlay.style.display="block";overlay.setAttribute("aria-hidden","false");loadWaitlist()}function exportWaitlist(){if(!waitlistRows.length){alert("There are no waitlist signups to export.");return}const headers=["Full Name","Email","Phone","Campus","Status","Admin Note","Joined"];const rows=waitlistRows.map(x=>[x.full_name,x.email,x.phone,x.campus||"",x.contact_status||"new",x.admin_note||"",new Date(x.created_at).toISOString()]);const csv=[headers,...rows].map(row=>row.map(v=>`"${String(v??"").replace(/"/g,'""')}"`).join(",")).join("\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download="studtask-waitlist.csv";a.click();URL.revokeObjectURL(url)}document.addEventListener("keydown",e=>{if(e.key==="Escape")closeWaitlist()});
async function logout(){await supabaseClient.auth.signOut();location.href="login.html"}init();
